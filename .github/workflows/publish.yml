name: publish

# Publishing is a deliberate act: push an annotated `v<version>` tag (or publish
# a GitHub release, or run this workflow by hand). The version always comes from
# package.json, so bump it in the commit the tag points at — npm refuses to
# publish over an existing version, and this workflow skips an already published
# version instead of failing.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing: the npm CLI exchanges this OIDC token for a short-lived
  # publish credential, so no long-lived npm token is stored anywhere. The same
  # permission carries the provenance attestation.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# npm's trusted publishing cannot read GitHub's immutable OIDC subject claims
# (npm/cli#9969), which every repository created after 2026-07-15 uses, so the
# OIDC exchange is refused with "403 OIDC permission denied for this action".
# When a granular access token is configured as NPM_TOKEN, publish with it and
# keep the OIDC step for the day the registry fix lands.
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify the tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Check whether this version is already on npm
        id: guard
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-telegram-plus@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-telegram-plus@${version} is already published; nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with
      # the node version above.
      - name: Publish with provenance (trusted publishing)
        if: steps.guard.outputs.published == 'false' && env.NPM_TOKEN == ''
        run: |
          npm install --global npm@latest
          npm --version
          npm publish --access public --provenance

      # Fallback while npm/cli#9969 is open: a granular access token with 2FA
      # bypass, scoped to this package, stored as the NPM_TOKEN secret.
      - name: Publish with provenance (granular token)
        if: steps.guard.outputs.published == 'false' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          npm install --global npm@latest
          npm --version
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --access public --provenance
